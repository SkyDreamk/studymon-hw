<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gacha Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#262c5c; --ink:#ffffff; --muted:#b9c0ea; --gold:#ffc93c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 35%, #3a427f 0%, #282f63 55%, #1b2048 100%);
    color: var(--ink); font-family: 'Baloo 2', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; overflow: hidden;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  header { width: 100%; max-width: 560px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 18px 0; }
  h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: .3px; text-align: center; }
  .icon-btn { width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,.1); color: #fff; display: grid; place-items: center; cursor: pointer; }
  .pill-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 48px; min-height: 48px; padding: 8px 14px; background: #fff; color: #0E2747; border: 2px solid #CFE3F8; border-radius: 999px; font-family: inherit; font-size: 18px; white-space: nowrap; cursor: pointer; flex: none; }
  #back { justify-self: start; } #mute { justify-self: end; }
  .pill-btn:focus-visible, .icon-btn:focus-visible, .turn:focus-visible, .knob:focus-visible, .collect:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  #fit { position: relative; flex: 1 1 auto; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #holder { position: relative; }
  #stage { position: absolute; left: 0; top: 0; width: 1199px; height: 1312px; transform-origin: 0 0; }
  .floor { position: absolute; left: 170px; top: 1205px; width: 860px; height: 120px; border-radius: 50%; background: radial-gradient(closest-side, rgba(10,12,40,.65), rgba(10,12,40,0)); }
  .floor-glow { position: absolute; left: 380px; top: 1180px; width: 440px; height: 110px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,190,70,.35), rgba(255,190,70,0)); }
  .layer { position: absolute; inset: 0; pointer-events: none; clip-path: ellipse(378px 262px at 594px 470px); }
  .ball { position: absolute; left: 0; top: 0; will-change: transform; }
  .back .ball { filter: brightness(.78) saturate(.95); }
  #machine { position: absolute; left: 0; top: 0; width: 1199px; height: 1312px; pointer-events: none; }
  .knob { position: absolute; left: 480px; top: 706px; width: 232px; height: 232px; border: 0; padding: 0; background: none; border-radius: 50%; cursor: pointer; }
  .knob img { width: 100%; height: 100%; display: block; transition: transform 2.1s cubic-bezier(.45,0,.25,1); }
  .knob:hover img { filter: brightness(1.08); }
  #chute { position: absolute; left: 446px; top: 952px; width: 306px; height: 236px; overflow: hidden; pointer-events: none; }
  #chuteBall { position: absolute; width: 176px; height: 176px; left: 64px; top: 52px; opacity: 0; cursor: pointer; pointer-events: auto; border: 0; padding: 0; background: none; }
  #chuteBall img { width: 100%; height: 100%; display: block; }
  #chuteBall.drop { opacity: 1; animation: drop 700ms cubic-bezier(.3,.0,.5,1) both; }
  #chuteBall.ready img { animation: wiggle 1.4s ease-in-out infinite; }
  @keyframes drop {
    0% { transform: translateY(-240px) rotate(-90deg); }
    55% { transform: translateY(0) rotate(10deg); }
    72% { transform: translateY(-34px) rotate(-6deg); }
    86% { transform: translateY(0) rotate(3deg); }
    93% { transform: translateY(-8px); }
    100% { transform: translateY(0) rotate(0); }
  }
  @keyframes wiggle { 0%,100% { transform: rotate(0) } 10% { transform: rotate(-8deg) } 20% { transform: rotate(7deg) } 30% { transform: rotate(0) } }

  .controls { width: 100%; max-width: 560px; padding: 6px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .turn {
    width: 100%; max-width: 340px; height: 58px; border: 0; border-radius: 29px; cursor: pointer;
    font-family: inherit; font-weight: 800; font-size: 21px; letter-spacing: .5px; color: #3b2400;
    background: linear-gradient(#ffe07a, #ffbf1f); box-shadow: 0 5px 0 #c98a00, 0 10px 24px rgba(255,190,40,.35);
    transition: transform .1s, box-shadow .1s, filter .2s;
  }
  .turn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c98a00, 0 6px 14px rgba(255,190,40,.3); }
  .turn:disabled { filter: grayscale(.5) brightness(.8); cursor: default; }
  .odds { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .odd { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 5px; border-radius: 99px; background: rgba(255,255,255,.08); font-size: 14px; color: var(--muted); }
  .odd img { width: 22px; height: 22px; }
  button.odd { border: 0; font-family: inherit; cursor: pointer; padding: 6px 12px; }
  button.odd.on { background: rgba(255,201,60,.22); color: #fff; box-shadow: inset 0 0 0 2px var(--gold); }
  button.odd.zero:not(.on) { opacity: .55; }
  .odd .ic { font-size: 18px; line-height: 1; }
  .odd b { color: #fff; font-weight: 600; }
  .history { display: flex; gap: 6px; min-height: 28px; align-items: center; font-size: 14px; color: var(--muted); }
  .history img { width: 26px; height: 26px; animation: pop .35s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes pop { from { transform: scale(0) } to { transform: scale(1) } }

  /* Reveal */
  #reveal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(10,12,36,.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 10; }
  #reveal.show { display: flex; animation: fade .3s ease both; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .burst { position: absolute; width: 760px; height: 760px; border-radius: 50%; opacity: 0; transform: scale(.3);
    background: repeating-conic-gradient(from 0deg, var(--tier) 0 9deg, transparent 9deg 22.5deg);
    -webkit-mask: radial-gradient(closest-side, #000 15%, transparent 72%); mask: radial-gradient(closest-side, #000 15%, transparent 72%);
    transition: opacity .5s, transform .7s cubic-bezier(.2,.9,.3,1.2); }
  #reveal.open .burst { opacity: .55; transform: scale(1); animation: spin 14s linear infinite; }
  @keyframes spin { to { rotate: 360deg } }
  .big { position: relative; width: 220px; height: 220px; margin-bottom: 6px; }
  .big img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .big .top { clip-path: inset(0 0 46% 0); transform-origin: 12% 54%; transition: transform .55s cubic-bezier(.3,1.4,.5,1), opacity .5s .25s; }
  .big .bot { clip-path: inset(54% 0 0 0); transition: transform .55s cubic-bezier(.3,1.4,.5,1), opacity .5s .25s; }
  .big.shake { animation: shake .9s ease-in-out both; }
  @keyframes shake { 0%,100% { transform: rotate(0) } 15% { transform: rotate(-14deg) } 30% { transform: rotate(12deg) } 45% { transform: rotate(-10deg) } 60% { transform: rotate(8deg) } 75% { transform: rotate(-4deg) } }
  #reveal.open .big .top { transform: translate(-30px,-120px) rotate(-38deg); opacity: 0; }
  #reveal.open .big .bot { transform: translateY(80px); opacity: 0; }
  .card { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 26px 30px 24px; width: min(320px, 86vw);
    border-radius: 26px; background: #fff; color: #1d2150; box-shadow: 0 20px 60px rgba(0,0,0,.4), 0 0 0 6px var(--tier);
    opacity: 0; transform: scale(.4) translateY(30px); transition: opacity .35s .3s, transform .6s .3s cubic-bezier(.2,.9,.3,1.3); }
  #reveal.open .card { opacity: 1; transform: none; }
  .card img { width: 84px; height: 84px; margin-bottom: 2px; }
  .card img.egg { width: 120px; height: 120px; object-fit: contain; }
  .card img.item { width: 120px; height: 120px; object-fit: contain; }
  .card .emoji { font-size: 84px; line-height: 104px; height: 104px; margin-bottom: 2px; }
  .tier { font-size: 14px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #fff; background: var(--tierInk); padding: 2px 12px; border-radius: 99px; }
  .prize { font-size: 30px; font-weight: 800; line-height: 1.1; margin: 6px 0 2px; }
  .sub { font-size: 15px; color: #4b527f; margin: 0 0 12px; }
  .collect { height: 50px; width: 100%; border: 0; border-radius: 25px; cursor: pointer; font-family: inherit; font-weight: 800; font-size: 18px; color: #fff; background: #1d2150; }
  .confetti { position: absolute; width: 10px; height: 16px; top: 50%; left: 50%; border-radius: 3px; pointer-events: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { #reveal.open .burst { animation: none; } }
</style>
</head>

let ac = null, muted = false;
function ctx() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; }
function tone(freq, dur, type = 'sine', vol = 0.15, delay = 0, slide = 0) {
  if (muted) return;
  const c = ctx(), t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  click: (d) => tone(1400, 0.04, 'square', 0.05, d),
  thunk: () => { tone(180, 0.25, 'sine', 0.35, 0, 0.5); tone(90, 0.3, 'triangle', 0.2, 0.02, 0.6); },
  rattle: () => { for (let i = 0; i < 26; i++) tone(420 + Math.random() * 760, 0.05, 'triangle', 0.045 + 0.03 * Math.sin(i / 25 * Math.PI), i * 0.075 + Math.random() * 0.03); tone(70, 2.0, 'sine', 0.12, 0, 1.3); },
  pop: () => tone(500, 0.18, 'sine', 0.25, 0, 2.4),
  win: (rank) => { const notes = [523, 659, 784, 1047, 1319, 1568]; const n = 3 + rank; for (let i = 0; i < n; i++) tone(notes[i], 0.35, 'triangle', 0.12, 0.09 * i); },
};

const GLOBE = { cx: 594, cy: 462, rx: 378, ry: 286, floor: 656 };
const layers = [
  { el: $('backLayer'), r: 70, count: 9, yOff: -54, balls: [] },

const types = TIERS.map(t => t.type);
function makeBall(L, type, x, y) {
  const img = new Image(); img.src = IMG[type]; img.className = 'ball'; img.alt = '';
  img.style.width = img.style.height = L.r * 2 + 'px';

  L.balls.push(b); return b;
}
layers.forEach((L) => {

const SPIN_TIME = 2.0;
let spinT = 0; // seconds remaining of drum spin
function spinPower() { if (spinT <= 0) return 0; const e = SPIN_TIME - spinT; return Math.max(0, Math.min(1, e / 0.35, spinT / 0.55)); }
function step(dt) {
  for (const L of layers) {
    const r = L.r, bs = L.balls.filter(b => !b.gone), s = spinPower();
    const ax = GLOBE.rx - r, ay = GLOBE.ry - r, cy = GLOBE.cy + L.yOff, fl = GLOBE.floor + L.yOff - r;
    for (const b of bs) {
      b.vy += 2200 * dt;
      if (s > 0) {
        // rotating-drum flow: capsules are dragged clockwise around the globe, lifted up one side and cascade down the other
        const rx = b.x - GLOBE.cx, ry = b.y - cy, dist = Math.hypot(rx, ry) || 1;
        const tx = -ry / dist, ty = rx / dist;
        const speed = 1500 * s * Math.min(1.15, Math.max(0.45, dist / 230));
        const k = Math.min(1, 5.5 * dt * s);
        b.vx += (tx * speed - b.vx) * k;
        b.vy += (ty * speed - b.vy) * k;
        b.vy -= 2200 * dt * 0.45 * s;           // partial lift so they stay airborne and tumble
        b.vx += rx / dist * -260 * dt * s;      // slight pull inward so they don't all hug the wall
        b.vy += ry / dist * -260 * dt * s;
      }
      b.vx *= 0.998; b.vy *= 0.998;
      b.x += b.vx * dt; b.y += b.vy * dt;
      // globe wall (ellipse)
      const dx = (b.x - GLOBE.cx) / ax, dy = (b.y - cy) / ay, e = dx * dx + dy * dy;
      if (e > 1) {
        const k = 1 / Math.sqrt(e);
        b.x = GLOBE.cx + (b.x - GLOBE.cx) * k; b.y = cy + (b.y - cy) * k;
        let nx = dx / ax, ny = dy / ay; const nl = Math.hypot(nx, ny); nx /= nl; ny /= nl;
        const vn = b.vx * nx + b.vy * ny;
        if (vn > 0) { b.vx -= 1.4 * vn * nx; b.vy -= 1.4 * vn * ny; b.vx *= 0.96; }
      }
      if (b.y > fl) { b.y = fl; if (b.vy > 0) b.vy *= -0.35; b.vx *= 0.94; }
    }
    // ball-ball
    for (let i = 0; i < bs.length; i++) for (let j = i + 1; j < bs.length; j++) {
      const p = bs[i], q = bs[j]; let dx = q.x - p.x, dy = q.y - p.y; const d = Math.hypot(dx, dy) || 0.01, min = r * 2 * 0.97;
      if (d < min) {
        dx /= d; dy /= d; const o = (min - d) / 2;
        p.x -= dx * o; p.y -= dy * o; q.x += dx * o; q.y += dy * o;
        const rv = (q.vx - p.vx) * dx + (q.vy - p.vy) * dy;
        if (rv < 0) { const imp = -1.3 * rv / 2; p.vx -= imp * dx; p.vy -= imp * dy; q.vx += imp * dx; q.vy += imp * dy; }
      }
    }
    for (const b of bs) {
      // rolling: spin follows travel speed; during the tumble each capsule also spins with the drum
      const target = (b.vx / r) + s * (5 + (b.spinBias || 0));
      b.w = (b.w || 0) + (target - (b.w || 0)) * Math.min(1, 8 * dt);
      b.a += b.w * dt;
    }
  }
}
function draw() {
  for (const L of layers) for (const b of L.balls) {
    if (b.anim) continue;
    b.img.style.transform = `translate(${b.x - L.r}px, ${b.y - L.r}px) rotate(${b.a}rad)`;
  }
}
let last = performance.now();
function loop(now) {
  let dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (spinT > 0) spinT -= dt;
  const n = 4; for (let i = 0; i < n; i++) step(dt / n);
  draw(); requestAnimationFrame(loop);
}

  if (busy) return; busy = true; ctx();
  $('turn').disabled = true; $('chuteBall').className = '';
  // 先向服务端要奖品；失败不跑动画、不扣次数（服务端失败本来就不扣）
  const wh = WHEELS.find(w => w.key === curKey) || WHEELS[0];
  let res = null, errMsg = '';
  try {
    const r = await fetch(wh.api, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ childId }) });
    res = await r.json().catch(() => null);
    if (!res || !res.ok || !res.prize) { errMsg = (res && res.error) || ''; res = null; }
  } catch (e) { res = null; }
  if (!res) {
    alert(errMsg || "Couldn't spin — try again later");
    $('turn').disabled = false; busy = false; return;
  }
  const tier = tierForPrize(res.prize);
  const prize = res.prize.name;
  current = { tier, prize, raw: res.prize };
  if (typeof res.chancesLeft === 'number') { counts[wh.key] = res.chancesLeft; renderOdds(); }

  // knob turn + rattle
  knobTurns++; $('knobImg').style.transform = `rotate(${knobTurns * 720}deg)`;
  for (let i = 0; i < 16; i++) sfx.click(i * 0.12 + i * i * 0.002);
  sfx.rattle(); spinT = SPIN_TIME;
  await wait(SPIN_TIME * 1000 + 250);

  // choose a ball from the front layer (lowest one), make it the winning colour
  const F = layers[1];
  const live = F.balls.filter(b => !b.gone).sort((a, b) => b.y - a.y);
  const ball = live.find(b => b.type === tier.type) || live[0];
  ball.type = tier.type; ball.img.src = IMG[tier.type];
  ball.gone = true; ball.anim = true;
  ball.img.style.transition = 'transform .6s cubic-bezier(.5,0,.8,.5)';
  ball.img.style.transform = `translate(${GLOBE.cx - F.r}px, ${GLOBE.floor + 120}px) rotate(${ball.a + 4}rad)`;
  await wait(650);
  ball.img.remove(); F.balls.splice(F.balls.indexOf(ball), 1);

  // drop into chute
  const cb = $('chuteBall'); $('chuteImg').src = IMG[tier.type];
  void cb.offsetWidth; cb.className = 'drop';
  setTimeout(sfx.thunk, 380);
  await wait(750);
  cb.className = 'drop ready';
  $('live').textContent = 'A capsule dropped — tap it to open.';

  // refill the globe from the top
  const nb = makeBall(F, types[Math.floor(Math.random() * types.length)], GLOBE.cx + (Math.random() - .5) * 200, 160);
  nb.vy = 200;
  await wait(500);
  openCapsule();
}

function confetti(color) {
  const R = $('reveal');
  for (let i = 0; i < 36; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.background = i % 3 ? color : '#ffffff';
    R.appendChild(c);
    const ang = Math.random() * Math.PI * 2, dist = 160 + Math.random() * 260;
    c.animate([
      { transform: 'translate(-50%,-50%) rotate(0) scale(1)', opacity: 1 },
      { transform: `translate(${Math.cos(ang) * dist}px, ${Math.sin(ang) * dist + 200}px) rotate(${Math.random() * 720}deg) scale(.6)`, opacity: 0 }
    ], { duration: 1400 + Math.random() * 600, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' }).onfinish = () => c.remove();
  }
}

let opening = false;
async function openCapsule() {
  if (!current || opening) return; opening = true;
  const { tier, prize } = current, rank = TIERS.indexOf(tier);
  const R = $('reveal');
  R.style.setProperty('--tier', tier.color); R.style.setProperty('--tierInk', tier.ink);
  $('bigTop').src = $('bigBot').src = IMG[tier.type];
  const raw = current.raw || {}, ci = $('cardImg'), ce = $('cardEmoji');
  if (raw.kind === 'egg' && EGG_SLUG[raw.species]) {
    ci.src = '/static/img/eggs/' + EGG_SLUG[raw.species] + '.webp'; ci.className = 'egg'; ci.style.display = ''; ce.style.display = 'none';
  } else if (raw.key && ITEM_IMG[raw.key]) {
    // 道具立绘（2026-11-19 用户发来的重构图）：按奖品 key 取 /static/img/items/ 单图
    ci.src = '/static/img/items/' + ITEM_IMG[raw.key] + '.webp'; ci.className = 'item'; ci.style.display = ''; ce.style.display = 'none';
  } else if (raw.key && BALL_IMG[raw.key]) {
    // 球类奖品：按奖品 key 取 /static/img/feat/ 对应球图（只给球类奖品用球图，不顶替别的奖品）
    ci.src = '/static/img/feat/gacha-ball-' + BALL_IMG[raw.key] + '.webp'; ci.className = 'item'; ci.style.display = ''; ce.style.display = 'none';
  } else {
    // 仍缺立绘的道具（经验/伤药等）：emoji 大字占位，不拿通用球图顶替
    ci.removeAttribute('src'); ci.style.display = 'none'; ce.textContent = raw.emoji || '🎁'; ce.style.display = '';
  }
  $('tierName').textContent = tier.tier;
  $('prizeName').textContent = prize;
  $('prizeSub').textContent = TIER_SUB[rank];
  R.className = 'show'; $('chuteBall').className = ''; $('chuteBall').style.opacity = 0;
  const big = $('big'); big.classList.remove('shake'); void big.offsetWidth; big.classList.add('shake');
  for (let i = 0; i < 3; i++) setTimeout(() => sfx.click(0), i * 250);
  await wait(950);
  sfx.pop(); R.className = 'show open'; confetti(tier.color);
  setTimeout(() => sfx.win(rank), 250);
  $('live').textContent = `${tier.tier}: ${prize}`;
  history.unshift(tier.type); if (history.length > 10) history.pop();
  saveHistory(); renderHistory();
  setTimeout(() => $('collect').focus(), 700);
}

function closeReveal() {
  $('reveal').className = ''; $('chuteBall').style.opacity = '';
  current = null; opening = false; busy = false; $('turn').disabled = false; $('turn').focus();
}

$('turn').onclick = draw_;
$('knob').onclick = draw_;
$('chuteBall').onclick = openCapsule;
$('collect').onclick = closeReveal;
addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('reveal').classList.contains('open')) closeReveal(); });

fit(); requestAnimationFrame((t) => { last = t; loop(t); });
loadInit();
restoreHistory();
</script>
</body>
